name: unit-tests
permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - release/*

concurrency:
  # We only need to be running tests for the latest commit on each PR
  # (however, we fully test every commit on master, even as new ones land).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  run-tests:
    name: ${{ matrix.suite }}-${{ matrix.group }}(py=${{ matrix.python-version }},dj=${{ matrix.django-version }},mongo=${{ matrix.mongo-version }})
    runs-on: ${{ matrix.os-version }}
    strategy:
      # One shard failing shouldn't cancel the other nine. At ~10 min a run,
      # seeing every failing shard at once is worth more than the runner
      # minutes saved by bailing early.
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        django-version: ["pinned"]
        mongo-version: ["7.0"]
        os-version: [ubuntu-24.04]
        # Work is divided by measured test duration (pytest-split), not by
        # hand-listing directories, so these are just group numbers. The two
        # suites exist because their tests need different Django settings and
        # therefore cannot share a process; within a suite the split is even.
        # Group counts are proportional to measured work: the lms suite is
        # ~56 machine-minutes, the cms suite ~20.
        include:
          - { suite: lms, group: 1 }
          - { suite: lms, group: 2 }
          - { suite: lms, group: 3 }
          - { suite: lms, group: 4 }
          - { suite: lms, group: 5 }
          - { suite: lms, group: 6 }
          - { suite: lms, group: 7 }
          - { suite: cms, group: 1 }
          - { suite: cms, group: 2 }
          - { suite: cms, group: 3 }
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: install system requirements
        run: |
          sudo apt-get update && sudo apt-get install libmysqlclient-dev libxmlsec1-dev lynx

      # We pull this image a lot, and Dockerhub will rate limit us if we pull too often.
      # This is an attempt to cache the image for better performance and to work around that.
      # It will cache all pulled images, so if we add new images to this we'll need to update the key.
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-mongo-${{ matrix.mongo-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongo-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: install requirements
        run: |
          if [[ "${{ matrix.django-version }}" == "pinned" ]]; then
            make test-requirements
          else
            uv sync --no-default-groups --group testing --group "django${{ matrix.django-version }}" --frozen
          fi

      - name: list installed package versions
        run: |
          uv tree

      - name: resolve suite configuration
        shell: bash
        run: |
          P=scripts/unit_test_suites_parser.py
          echo "settings_path=$(uv run python $P --suite-name=${{ matrix.suite }} --output settings)" >> $GITHUB_ENV
          echo "unit_test_paths=$(uv run python $P --suite-name=${{ matrix.suite }} --output paths)" >> $GITHUB_ENV
          echo "splits=$(uv run python $P --suite-name=${{ matrix.suite }} --output splits)" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "report_log_arg=--report-log=reports/pytest-report-${{ matrix.suite }}-${{ matrix.group }}.jsonl" >> $GITHUB_ENV
          else
            echo "report_log_arg=" >> $GITHUB_ENV
          fi

      - name: report available parallelism
        shell: bash
        run: |
          echo "nproc: $(nproc)"
          uv run python -c "import os, psutil; print('logical:', os.cpu_count(), 'physical:', psutil.cpu_count(logical=False))"

      - name: run tests
        shell: bash
        run: |
          # --cov-report="" suppresses the per-shard terminal coverage table
          # (~3.7k lines of noise). The .coverage data file is still written and
          # uploaded as an artifact for the combined `coverage` job below.
          #
          # -n logical spreads this group across every vCPU on the runner.
          # --dist loadfile groups by module: ModuleStoreIsolationMixin keeps
          # process-global stacks that require strict LIFO unwinding, and
          # splitting a module's classes across workers breaks that.
          #
          # --splits/--group take this runner's share of the suite, chosen by
          # measured duration rather than by directory. The durations file is
          # per-suite because ~8k shared tests run under both settings with the
          # same node id, and merging them would double their recorded cost.
          # Tests missing from the file are assumed to be of average length, so a
          # stale file degrades balance but never correctness.
          uv run python -Wd -m pytest -p no:randomly -n logical --dist loadfile \
            --splits ${{ env.splits }} --group ${{ matrix.group }} \
            --durations-path .test_durations.${{ matrix.suite }} --splitting-algorithm least_duration \
            --ds=${{ env.settings_path }} ${{ env.unit_test_paths }} \
            --cov=. --cov-report="" ${{ env.report_log_arg }}

      - name: Upload pytest timing report
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.suite }}-${{ matrix.group }}-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ matrix.mongo-version }}-${{ matrix.os-version }}
          path: reports/pytest-report-${{ matrix.suite }}-${{ matrix.group }}.jsonl
          overwrite: true

      - name: rename warnings json file
        if: success()
        shell: bash
        run: |
          cd test_root/log
          mv pytest_warnings.json pytest_warnings_${{ matrix.suite }}-${{ matrix.group }}_${{ matrix.python-version }}_${{ matrix.django-version }}_${{ matrix.mongo-version }}_${{ matrix.os-version }}.json

      - name: save pytest warnings json file
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-warnings-json-${{ matrix.suite }}-${{ matrix.group }}-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ matrix.mongo-version }}-${{ matrix.os-version }}
          path: |
            test_root/log/pytest_warnings*.json
          overwrite: true

      - name: Renaming coverage data file
        run: |
          mv reports/.coverage reports/${{ matrix.suite }}-${{ matrix.group }}_${{ matrix.python-version }}_${{ matrix.django-version }}_${{ matrix.mongo-version }}_${{ matrix.os-version }}.coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.group }}-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ matrix.mongo-version }}-${{ matrix.os-version }}
          path: reports/${{ matrix.suite }}-${{ matrix.group }}_${{ matrix.python-version }}_${{ matrix.django-version }}_${{ matrix.mongo-version }}_${{ matrix.os-version }}.coverage
          overwrite: true

  # This job aggregates test results. It's the required check for branch protection.
  # https://github.com/marketplace/actions/alls-green#why
  # https://github.com/orgs/community/discussions/33579
  success:
    name: Unit tests successful
    runs-on: ubuntu-24.04
    if: always()
    needs: [run-tests]
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        # uses: re-actors/alls-green@v1.2.1
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}

  compile-warnings-report:
    runs-on: ubuntu-24.04
    needs: [run-tests]
    steps:
      - uses: actions/checkout@v7
      - name: collect pytest warnings files
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-warnings-json-*
          merge-multiple: true
          path: test_root/log

      - name: display structure of downloaded files
        run: ls -la test_root/log

      - name: compile warnings report
        run: |
          python openedx/core/process_warnings.py --dir-path test_root/log --html-path reports/pytest_warnings/warning_report_all.html

      - name: save warning report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-warning-report-html
          path: |
            reports/pytest_warnings/warning_report_all.html
          overwrite: true

  merge-artifacts:
    runs-on: ubuntu-24.04
    needs: [compile-warnings-report]
    steps:
      - name: Merge Pytest Warnings JSON Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: pytest-warnings-json
          pattern: pytest-warnings-json-*
          delete-merged: true

      - name: Merge Coverage Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: coverage
          pattern: coverage-*
          delete-merged: true

  # Combine and upload coverage reports.
  coverage:
    if: (github.repository == 'edx/edx-platform-private') || (github.repository == 'openedx/openedx-platform' && (startsWith(github.base_ref, 'release') == false))
    runs-on: ubuntu-24.04
    needs: [merge-artifacts]
    strategy:
      matrix:
        python-version:
          - 3.12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: reports

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --no-default-groups --only-group coverage --no-install-project --frozen

      - name: Run coverage
        run: |
          uv run coverage combine reports/*
          uv run coverage report
          uv run coverage xml
      - uses: codecov/codecov-action@v7
