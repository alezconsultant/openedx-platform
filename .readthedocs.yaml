version: 2

build:
  os: "ubuntu-lts-latest"
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # uv doesn't exist yet in RTD's freshly-created environment.
      - pip install uv
    post_install:
      # RTD doesn't set $VIRTUAL_ENV, so `uv sync --active` would silently
      # fall back to a local .venv. Derive it from python's path (PEP 405:
      # <venv>/bin/python -> grandparent is the venv root).
      - export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")" && uv sync --active --no-default-groups --group docs --frozen

sphinx:
  configuration: docs/conf.py
