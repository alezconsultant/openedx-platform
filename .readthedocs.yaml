version: 2

build:
  os: "ubuntu-lts-latest"
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # uv doesn't exist yet in RTD's freshly-created environment, so this one
      # step can't itself use uv -- everything after it does.
      - pip install uv
    post_install:
      # --active: sync into RTD's own already-created/activated virtualenv
      # directly, rather than a separate uv-managed .venv -- this keeps RTD's
      # normal sphinx auto-build detection intact, and also installs the local
      # project itself as an editable install (same as the old separate
      # `pip install -e .` step, now automatic). --group, not --only-group,
      # because the latter excludes [project.dependencies] entirely, which
      # would leave Django/XBlock/etc. unconstrained by uv.lock's
      # [tool.uv].constraint-dependencies, e.g. picking setuptools>=82 and
      # breaking fs/pyfilesystem2's pkg_resources import. --frozen: never let
      # this step attempt to re-resolve/mutate uv.lock.
      - uv sync --active --no-default-groups --group docs --frozen

sphinx:
  configuration: docs/conf.py
